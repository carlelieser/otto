name: verify

# `qa.md` §12 puts the lint rules second in the execution order, "from the first
# commit, per ADR-0001 and ADR-0003", and §4.1 requires that they fail the build
# rather than warn. They are tests, so they run with the suite.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run the boundary rules first and separately. They are the cheapest tests
      # in the plan and they guard the most important boundary, so a violation
      # should be legible at a glance rather than buried in the full run.
      - name: Layering rules (qa.md §4.1)
        run: npm run lint:boundaries

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Test suite
        run: npm test

  # Slice 1 puts the Rust build in CI first rather than last: a Rust CI
  # discovered broken at the end of the slice is a Rust CI that gets disabled.
  # A commit that breaks `cargo build` fails exactly as one that breaks
  # `npm run verify` does.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The toolchain comes from `rust-toolchain.toml`, so CI and every
      # developer agree without the version being written down twice.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's Linux build needs the system WebKit and its tray dependencies.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The supervisor's integration tests drive a real spawned sidecar, so the
      # sidecar has to exist before they run.
      - name: Build the sidecar
        run: npm run build:sidecar

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # The latency test is tagged out of the default run: a shared runner's
      # timing is noise, and a flaky red build gets deleted rather than fixed
      # (`qa.md` §8). Everything else runs.
      - name: Test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml
